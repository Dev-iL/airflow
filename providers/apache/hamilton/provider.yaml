---
package-name: apache-airflow-providers-apache-hamilton
name: Apache Hamilton
description: |
  Execute reusable `Apache Hamilton <https://hamilton.apache.org/>`__ transformations inside Airflow tasks.

  .. note::

     This provider has not been released. Version ``1.0.0`` is the planned first release.
     The generated publication, documentation, and download links below are placeholders;
     their release artifacts are not available. Until publication, install a wheel built
     from a source checkout containing this provider.
state: ready
lifecycle: incubation
# apache-hamilton requires Python 3.10.1 or later.
min-python-version: "3.10.1"
source-date-epoch: 1789992000
versions:
  - 1.0.0
integrations:
  - integration-name: Apache Hamilton
    external-doc-url: https://hamilton.apache.org/
    how-to-guide:
      - /docs/apache-airflow-providers-apache-hamilton/operators/hamilton.rst
    tags: [apache]
operators:
  - integration-name: Apache Hamilton
    python-modules:
      - airflow.providers.apache.hamilton.operators.hamilton
task-decorators:
  - class-name: airflow.providers.apache.hamilton.decorators.hamilton.hamilton_task
    name: hamilton
